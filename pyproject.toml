[project]
name = "entertainer"
version = "0.1.0"
description = "A personal, self-improving movie and TV recommendation engine for multilingual catalogues."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "duckdb>=1.1",
    "polars>=1.17",
    "pyarrow>=18.0",
    "numpy>=1.26,<3",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "implicit>=0.7.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "tqdm>=4.67",
    "python-dotenv>=1.0",
    "platformdirs>=4.3",
    "pydantic>=2.10",
]

[project.optional-dependencies]
encode = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "transformers>=4.47",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
entertainer = "entertainer.cli:app"
ent = "entertainer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entertainer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # Typer's entire API is built on calls in argument defaults.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
