<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>entertainer — Build Studio</title>
<style>
  :root{--bg:#050505;--ink:#f2f2f0;--dim:#777;--line:rgba(255,255,255,.15);--soft:rgba(255,255,255,.05)}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
  header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);letter-spacing:.06em;font-size:12px;text-transform:uppercase}.brand{font-weight:650}.status{color:var(--dim)}.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 8px 1px 0}.status.live{color:var(--ink)}
  main{max-width:860px;margin:0 auto;padding:44px 22px 28px;text-align:center}.stage{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);min-height:18px}.title{font-size:clamp(25px,5vw,48px);font-weight:420;letter-spacing:-.045em;line-height:1.05;margin:11px auto 0;max-width:700px}.core{position:relative;width:min(560px,94vw);height:370px;margin:8px auto -3px}.core:after{content:"";position:absolute;left:50%;top:50%;width:86px;height:86px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fff 0 3%,rgba(255,255,255,.45) 6%,rgba(255,255,255,.04) 34%,transparent 68%);filter:blur(.1px);animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{scale:1.18;opacity:.72}}
  svg{width:100%;height:100%;overflow:visible}.edge{stroke:rgba(255,255,255,.13);stroke-width:1}.edge.live{stroke:#fff;stroke-width:1.2;stroke-dasharray:3 9;animation:signal 1.6s linear infinite}@keyframes signal{to{stroke-dashoffset:-24}}.node{fill:#080808;stroke:rgba(255,255,255,.45);stroke-width:1}.node.done{fill:#f2f2f0}.node.live{fill:#fff;filter:drop-shadow(0 0 8px white);animation:nodebreathe 2.4s ease-in-out infinite}@keyframes nodebreathe{50%{r:8}}
  .readout{display:flex;align-items:baseline;justify-content:center;gap:16px;margin-top:-18px}.percent{font-size:36px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}.meter{width:min(420px,92vw);height:2px;background:var(--soft);margin:18px auto 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ink);transition:width .45s ease}.detail{margin:30px auto 0;max-width:600px;border-top:1px solid var(--line);text-align:left}.detail summary{cursor:pointer;list-style:none;padding:14px 2px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.detail summary::-webkit-details-marker{display:none}.detail summary::after{content:"+";float:right;color:var(--ink);font-size:16px;line-height:12px}.detail[open] summary::after{content:"−"}.details-inner{padding:5px 2px 18px;color:var(--dim);font-size:12px;display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px}.row b{font-weight:500;color:var(--ink);text-align:right}.empty{padding:104px 0;color:var(--dim);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:24px;font-weight:430;letter-spacing:-.03em;margin-bottom:8px}.history{margin-top:22px;color:var(--dim);font-size:11px}.history button{background:transparent;color:var(--dim);border:0;padding:0;text-decoration:underline;cursor:pointer;font:inherit}.error{color:#e5baba}@media(prefers-reduced-motion:reduce){.core:after,.node.live,.edge.live{animation:none}}
</style></head>
<body>
<header><div class="brand">entertainer <span style="color:var(--dim)">/ build</span></div><div class="status" id="status">waiting</div></header>
<main id="app"><div class="empty"><strong>Build Studio</strong>Run <code>ent setup</code> in another terminal.<br>Its local progress will appear here.</div></main>
<script>
const $=s=>document.querySelector(s); let selected=null;
const labels={sources:'Verifying source data',catalogue:'Assembling the catalogue',tmdb:'Gathering film context',prune:'Refining the catalogue',embeddings:'Forming the movie signal field',cf:'Learning audience patterns',fusion:'Joining the signals',prior:'Calibrating the starting point'};
function mesh(stages,active){const points=[[88,170],[145,80],[170,267],[270,45],[285,150],[275,300],[390,80],[430,213],[505,146],[470,315]];let edges='';for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++)if(Math.hypot(points[i][0]-points[j][0],points[i][1]-points[j][1])<165){const live=i===4||j===4;edges+=`<line class="edge ${live?'live':''}" x1="${points[i][0]}" y1="${points[i][1]}" x2="${points[j][0]}" y2="${points[j][1]}"/>`}const complete=stages.filter(s=>s.status==='complete').length;return `<svg viewBox="0 0 590 355" aria-label="Abstract live signal field"><g>${edges}</g>${points.map((p,i)=>`<circle class="node ${i<complete?'done':''} ${i===4&&active?'live':''}" cx="${p[0]}" cy="${p[1]}" r="${i===4?7:4}"/>`).join('')}</svg>`}
function render(data){const status=data.status||'running', stages=data.stages||[], current=stages.find(s=>s.status==='running'), done=stages.filter(s=>s.status==='complete'||s.status==='skipped').length, pct=status==='complete'?100:Math.round(done/stages.length*100);$('#status').className='status '+(status==='running'?'live':status==='failed'?'error':'');$('#status').textContent=status==='running'?'building':status==='complete'?'complete':status==='failed'?'needs attention':'waiting';$('#app').innerHTML=`<div class="stage">${status==='running'?'live build':status}</div><h1 class="title">${current?labels[current.id]||current.label:status==='complete'?'The system is ready':'Build needs attention'}</h1><div class="core">${mesh(stages,current)}</div><div class="readout"><span class="percent">${pct}%</span><span class="label">${done} / ${stages.length} stages</span></div><div class="meter"><i style="width:${pct}%"></i></div><details class="detail"><summary>Build detail</summary><div class="details-inner">${stages.map(s=>`<div class="row"><span>${s.label}</span><b>${s.status}${s.elapsed_seconds?` · ${Math.round(s.elapsed_seconds)}s`:''}</b></div>`).join('')}<div class="row"><span>Started</span><b>${new Date(data.started_at).toLocaleString()}</b></div>${data.manifest_id?`<div class="row"><span>Manifest</span><b>${data.manifest_id}</b></div>`:''}</div></details>`}
async function refresh(){try{const d=await fetch('/api/builds').then(r=>r.json());const current=selected?d.builds.find(x=>x.id===selected):d.current;if(current)render(current);else {$('#status').textContent='waiting';$('#app').innerHTML='<div class="empty"><strong>Build Studio</strong>Run <code>ent setup</code> in another terminal.<br>Its local progress will appear here.</div>'}}catch(e){$('#status').className='status error';$('#status').textContent='offline'}}refresh();setInterval(refresh,1000);
</script></body></html>
