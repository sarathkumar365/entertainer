<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>entertainer — rate</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --line:#262a35; --text:#e8eaf0;
    --dim:#8a90a3; --accent:#7aa2f7; --love:#f7768e; --like:#9ece6a;
    --meh:#e0af68; --dis:#7f849c; --hate:#565f89;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(14,15,19,.96);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
  h1 span{color:var(--dim);font-weight:400}
  .count{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:650}
  input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);padding:6px 11px}
  button:hover{border-color:var(--accent)}
  button.ghost{background:transparent;color:var(--dim);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{background:#1d2333;border-color:var(--accent);color:var(--text)}
  .chip.low{opacity:.55}
  main{padding:20px;max-width:1500px;margin:0 auto}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(188px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;display:flex;flex-direction:column;transition:opacity .18s,transform .18s}
  .card.gone{opacity:0;transform:scale(.94)}
  .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1b1e27;display:block}
  .meta{padding:9px 10px 4px;flex:1}
  .t{font-weight:600;font-size:13.5px;line-height:1.25}
  .ot{color:var(--dim);font-size:11.5px;margin-top:2px}
  .sub{color:var(--dim);font-size:11.5px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#1d212c;padding:1px 6px;border-radius:4px}
  .acts{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px}
  .acts button{padding:7px 0;font-size:15px;border:none;background:#1b1f2a;border-radius:6px}
  .acts button:hover{background:#252b3a;transform:translateY(-1px)}
  .acts button[data-v=love]:hover{background:var(--love);color:#111}
  .acts button[data-v=like]:hover{background:var(--like);color:#111}
  .acts button[data-v=meh]:hover{background:var(--meh);color:#111}
  .acts button[data-v=dislike]:hover{background:var(--dis);color:#111}
  .acts button[data-v=unseen]:hover{background:var(--hate);color:#fff}
  .sec{margin:26px 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.09em;font-weight:650}
  .empty{color:var(--dim);padding:50px 0;text-align:center}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);padding:10px 16px;border-radius:9px;font-size:13.5px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
  .toast.show{opacity:1;pointer-events:auto}
  .toast button{margin-left:12px;padding:3px 10px;font-size:12.5px}
  .legend{color:var(--dim);font-size:12px;margin-top:9px}
  .legend b{color:var(--text);font-weight:600}
  .badge{background:#1d2333;border:1px solid var(--line);color:var(--dim);
    font-size:11px;padding:2px 7px;border-radius:999px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>entertainer <span>· rate what you have seen</span></h1>
    <span class="count" id="count">0</span><span style="color:var(--dim);font-size:13px">rated</span>
    <input type="search" id="q" placeholder="Search any film or series — including ones not in the catalogue…" autocomplete="off">
    <button class="ghost" id="undo">Undo</button>
    <button class="ghost" id="more">Load more</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="legend">
    <b>♥</b> loved · <b>+</b> liked · <b>~</b> fine · <b>−</b> disliked · <b>?</b> not seen
    &nbsp;·&nbsp; showing well-received titles from the last <b id="yrs">2</b> years, balanced across languages
  </div>
</header>

<main>
  <div id="searchwrap" style="display:none">
    <div class="sec">Search results</div>
    <div class="grid" id="searchgrid"></div>
  </div>
  <div class="sec" id="feedhead">Recent, well received in its own industry</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Nothing left here. Widen the languages or years.</div>
</main>

<div class="toast" id="toast"><span id="toastmsg"></span><button id="toastundo">Undo</button></div>

<script>
const $ = s => document.querySelector(s);
const VERDICTS = [["love","♥"],["like","+"],["meh","~"],["dislike","−"],["unseen","?"]];
let weights = {}, page = 0, rated = 0;

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function card(it, external){
  const el = document.createElement('div');
  el.className = 'card';
  const poster = it.poster
    ? `<img class="poster" loading="lazy" src="${it.poster}" alt="">`
    : `<div class="poster"></div>`;
  const bits = [];
  if(it.year) bits.push(`<span class="tag">${it.year}</span>`);
  if(it.language_name) bits.push(`<span class="tag">${it.language_name}</span>`);
  if(it.kind === 'tv') bits.push(`<span class="tag">series</span>`);
  if(it.rating) bits.push(`<span class="tag">★ ${Number(it.rating).toFixed(1)}</span>`);
  if(external) bits.push(`<span class="badge">not in catalogue</span>`);
  el.innerHTML = `
    ${poster}
    <div class="meta">
      <div class="t">${it.title ?? ''}</div>
      ${it.original_title ? `<div class="ot">${it.original_title}</div>` : ``}
      <div class="sub">${bits.join('')}</div>
    </div>
    <div class="acts">
      ${VERDICTS.map(([v,g]) => `<button data-v="${v}" title="${v}">${g}</button>`).join('')}
    </div>`;
  el.querySelectorAll('.acts button').forEach(b => {
    b.onclick = async () => {
      el.classList.add('gone');
      try{
        if(external){
          await api('/api/add', {method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({tmdb_id: it.tmdb_id, kind: it.kind, verdict: b.dataset.v})});
        } else {
          await api('/api/rate', {method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({item_id: it.item_id, verdict: b.dataset.v})});
        }
        if(b.dataset.v !== 'unseen'){ rated++; $('#count').textContent = rated; }
        toast(`${it.title} — ${b.dataset.v}`);
        setTimeout(() => el.remove(), 180);
      }catch(e){ el.classList.remove('gone'); toast('failed: ' + e.message); }
    };
  });
  return el;
}

let toastTimer;
function toast(msg){
  $('#toastmsg').textContent = msg;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 3200);
}

function langParam(){
  return Object.entries(weights).filter(([,w]) => w > 0)
    .map(([c,w]) => `${c}:${w}`).join(',');
}

async function loadFeed(append){
  const d = await api(`/api/feed?years=2&limit=60&page=${page}&langs=${encodeURIComponent(langParam())}`);
  const g = $('#grid');
  if(!append) g.innerHTML = '';
  d.items.forEach(it => g.appendChild(card(it, false)));
  $('#empty').style.display = g.children.length ? 'none' : 'block';
}

async function loadLanguages(){
  const d = await api('/api/languages');
  const box = $('#chips');
  d.languages.forEach(l => {
    weights[l.code] = l.weight;
    const c = document.createElement('span');
    c.className = 'chip' + (l.weight > 0 ? ' on' : '') + (l.weight > 0 && l.weight < 0.4 ? ' low' : '');
    c.textContent = `${l.name}`;
    c.title = `${l.titles} titles · weight ${l.weight}`;
    c.onclick = () => {
      weights[l.code] = weights[l.code] > 0 ? 0 : (l.weight || 1);
      c.className = 'chip' + (weights[l.code] > 0 ? ' on' : '')
        + (weights[l.code] > 0 && weights[l.code] < 0.4 ? ' low' : '');
      page = 0; loadFeed(false);
    };
    box.appendChild(c);
  });
}

let searchTimer;
$('#q').oninput = e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if(!q){ $('#searchwrap').style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    const d = await api('/api/search?q=' + encodeURIComponent(q));
    const g = $('#searchgrid'); g.innerHTML = '';
    d.catalogue.forEach(it => g.appendChild(card(it, false)));
    d.tmdb.forEach(it => g.appendChild(card(it, true)));
    $('#searchwrap').style.display = (d.catalogue.length + d.tmdb.length) ? 'block' : 'none';
  }, 320);
};

$('#more').onclick = () => { page++; loadFeed(true); };
async function doUndo(){
  const d = await api('/api/undo', {method:'POST'});
  if(d.ok){ rated = Math.max(0, rated - 1); $('#count').textContent = rated;
            toast('undone: ' + (d.title || d.item_id)); }
  else toast('nothing to undo');
}
$('#undo').onclick = doUndo;
$('#toastundo').onclick = doUndo;

(async () => {
  const p = await api('/api/progress');
  rated = p.rated; $('#count').textContent = rated;
  await loadLanguages();
  await loadFeed(false);
})();
</script>
</body>
</html>
